<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NT Greek: New Testament Vocabulary</title>
  <meta name="apple-mobile-web-app-title" content="NT Greek">
  <meta name="theme-color" content="#fbf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#10151f" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vollkorn:ital,wght@0,400;0,600;0,800;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <button class="brand" data-go="home" aria-label="Home">NT Greek</button>
    <span class="tag note">prototype</span>
  </header>

  <main id="app" aria-live="polite">
    <p class="loading">Loading word lists…</p>
  </main>

  <!-- Bottom bar: the app's other pages, within thumb reach on a phone. Names left open (David):
       the buttons read 1, 2, 3, 4, each numeral where Telamon has its icon. -->
  <nav class="tabs" aria-label="Pages">
    <button data-go="home" aria-current="page" aria-label="Home"><b class="num" aria-hidden="true">1</b></button>
    <button data-go="tools" aria-label="Tools"><b class="num" aria-hidden="true">2</b></button>
    <button data-go="settings" aria-label="Settings"><b class="num" aria-hidden="true">3</b></button>
    <button data-go="about" aria-label="About"><b class="num" aria-hidden="true">4</b></button>
  </nav>

  <script type="module" src="app.js"></script>
</body>
</html>
